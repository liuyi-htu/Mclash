name: Windows checks

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.9
  GO_VERSION: 1.24.0

concurrency:
  group: windows-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: windows/windows-service/go.sum

      - name: Check and test Flutter client
        shell: powershell
        working-directory: windows/mclash
        run: |
          New-Item -ItemType Directory -Path assets -Force | Out-Null
          Copy-Item -LiteralPath "../../assets/default-config.yaml" -Destination "assets/default-config.yaml" -Force
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart format --output=none --set-exit-if-changed lib test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter test

      - name: Check Windows packaging script syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $script = (Resolve-Path "windows/scripts/build-windows.ps1").Path
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Check and test Windows service
        shell: powershell
        working-directory: windows/windows-service
        run: |
          $unformatted = @(gofmt -l .)
          if ($unformatted.Count -gt 0) {
            $unformatted | ForEach-Object { Write-Error "Go file is not formatted: $_" }
            exit 1
          }
          go mod tidy -diff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
