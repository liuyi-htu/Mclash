name: Windows checks

on:
  push:
    paths:
      - "windows/**"
      - ".github/workflows/windows-check.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows/windows-service/go.mod
          cache-dependency-path: windows/windows-service/go.sum

      - name: Check and test Flutter client
        shell: powershell
        working-directory: windows/mclash
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - name: Check and test Windows service
        shell: powershell
        working-directory: windows/windows-service
        run: |
          $unformatted = @(gofmt -l .)
          if ($unformatted.Count -gt 0) {
            $unformatted | ForEach-Object { Write-Error "Go file is not formatted: $_" }
            exit 1
          }
          go mod tidy -diff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
