name: Build Mclash clients

on:
  workflow_dispatch:
    inputs:
      target:
        description: Client to build
        required: true
        default: all
        type: choice
        options:
          - all
          - root
          - android
          - windows
      version:
        description: x.y.z; clear the field to reuse the latest built version
        required: false
        default: "2.2.0"
        type: string
      build_number:
        description: Latest build number; unchanged values advance automatically
        required: false
        default: "1"
        type: string
      release_notes:
        description: Optional release notes shown below the Mihomo core version
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: build-mclash-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.32.8
  HEV_VERSION: 2.17.1
  HEV_COMMIT: 9a06bc6e7989da54e3d32ff701ef7a7ce4995d3a

jobs:
  validate:
    name: Resolve build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build_number: ${{ steps.resolve.outputs.build_number }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      mihomo_version: ${{ steps.resolve.outputs.mihomo_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and build number
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          mihomo_version=$(gh api repos/MetaCubeX/mihomo/releases/latest --jq '.tag_name')
          [[ -n "$mihomo_version" && "$mihomo_version" != *$'\n'* ]] || {
            echo "Cannot determine the latest Mihomo core version" >&2
            exit 1
          }
          echo "mihomo_version=$mihomo_version" >> "$GITHUB_OUTPUT"
          python3 <<'PY'
          import os
          import pathlib
          import re

          version_pattern = re.compile(r"^\d+\.\d+\.\d+$")
          build_pattern = re.compile(r"^[1-9]\d*$")

          pubspec = pathlib.Path("root/pubspec.yaml").read_text(encoding="utf-8")
          source_match = re.search(
              r"(?m)^version:\s*(\d+\.\d+\.\d+)(?:\+(\d+))?\s*$", pubspec
          )
          if not source_match:
              raise SystemExit("Cannot determine the current version from root/pubspec.yaml")
          source_version = source_match.group(1)
          source_build = int(source_match.group(2) or "1")

          requested_version = os.environ["REQUESTED_VERSION"].strip()
          requested_build = os.environ["REQUESTED_BUILD_NUMBER"].strip()
          if requested_build and not build_pattern.fullmatch(requested_build):
              raise SystemExit("build_number must be a positive integer")
          version = requested_version or source_version
          selected_previous_build = source_build if version == source_version else 0

          default_values_unchanged = (
              version != source_version and requested_build == str(source_build)
          )
          if not requested_build or default_values_unchanged:
              build_number = str(selected_previous_build + 1)
          else:
              requested_build_number = int(requested_build)
              if requested_build_number <= selected_previous_build:
                  build_number = str(selected_previous_build + 1)
              else:
                  build_number = requested_build

          if not version_pattern.fullmatch(version):
              raise SystemExit("version must use x.y.z format")
          if not build_pattern.fullmatch(build_number):
              raise SystemExit("build_number must be a positive integer")
          if int(build_number) > 65535:
              raise SystemExit("build_number must not exceed 65535 for Windows file versions")
          release_tag = f"v{version}-b{build_number}"

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"version={version}\n")
              stream.write(f"build_number={build_number}\n")
              stream.write(f"release_tag={release_tag}\n")

          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as stream:
              stream.write("## Resolved build version\n\n")
              stream.write(f"- Source: `{source_version}+{source_build}` (root/pubspec.yaml)\n")
              stream.write(f"- Selected: `{version}+{build_number}`\n")
              stream.write(f"- Release tag: `{release_tag}`\n")
          print(f"Resolved build version: {version}+{build_number} ({release_tag})")
          PY

  root:
    name: Root Android
    if: ${{ inputs.target == 'all' || inputs.target == 'root' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set selected version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("root/pubspec.yaml")
          text = path.read_text(encoding="utf-8")
          version = f"{os.environ['APP_VERSION']}+{os.environ['BUILD_NUMBER']}"
          updated, count = re.subn(r"(?m)^version:\s*.*$", f"version: {version}", text)
          if count != 1:
              raise SystemExit("root/pubspec.yaml must contain exactly one version field")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || {
              echo "Missing repository secret: $name" >&2
              exit 1
            }
          done
          keystore_file="$RUNNER_TEMP/mclash-root-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          chmod 600 "$keystore_file"
          keytool -list -keystore "$keystore_file" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          {
            echo "storeFile=$keystore_file"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > root/android/key.properties
          chmod 600 root/android/key.properties

      - name: Build Root APK
        shell: bash
        working-directory: root
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./build-mclash-root.sh

      - name: Name Root artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_file="root/dist/Mclash-root-arm64-v8a.apk"
          output_file="root/dist/Mclash-root-${APP_VERSION}+${BUILD_NUMBER}-arm64-v8a.apk"
          mv "$source_file" "$output_file"
          (cd root/dist && sha256sum "$(basename "$output_file")" > "$(basename "$output_file").sha256")

      - name: Upload Root artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mclash-root-${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}
          path: |
            root/dist/Mclash-root-${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}-arm64-v8a.apk
            root/dist/Mclash-root-${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}-arm64-v8a.apk.sha256
          if-no-files-found: error

  android:
    name: Android
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set selected version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("android/pubspec.yaml")
          text = path.read_text(encoding="utf-8")
          version = f"{os.environ['APP_VERSION']}+{os.environ['BUILD_NUMBER']}"
          updated, count = re.subn(r"(?m)^version:\s*.*$", f"version: {version}", text)
          if count != 1:
              raise SystemExit("android/pubspec.yaml must contain exactly one version field")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Configure Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || {
              echo "Missing repository secret: $name" >&2
              exit 1
            }
          done
          keystore_file="$RUNNER_TEMP/mclash-android-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_file"
          chmod 600 "$keystore_file"
          keytool -list -keystore "$keystore_file" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          {
            echo "storeFile=$keystore_file"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/android/key.properties
          chmod 600 android/android/key.properties

      - name: Build HevSocks5Tunnel JNI library
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [[ -n "$android_sdk" ]] || {
            echo "ANDROID_SDK_ROOT and ANDROID_HOME are both unset" >&2
            exit 1
          }
          sdkmanager_bin="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin=$(find "$android_sdk/cmdline-tools" -type f -name sdkmanager \
              -perm -u+x -print -quit 2>/dev/null || true)
          fi
          [[ -x "$sdkmanager_bin" ]] || {
            echo "sdkmanager was not found under $android_sdk/cmdline-tools" >&2
            exit 1
          }
          "$sdkmanager_bin" "ndk;27.2.12479018" >/dev/null
          hev_source="$RUNNER_TEMP/hev-socks5-tunnel"
          git clone --depth 1 --branch "$HEV_VERSION" --recurse-submodules \
            https://github.com/heiher/hev-socks5-tunnel.git "$hev_source"
          actual_hev_commit=$(git -C "$hev_source" rev-parse HEAD)
          [[ "$actual_hev_commit" == "$HEV_COMMIT" ]] || {
            echo "HevSocks5Tunnel commit mismatch: expected $HEV_COMMIT, got $actual_hev_commit" >&2
            exit 1
          }
          ln -s . "$hev_source/jni"
          "$android_sdk/ndk/27.2.12479018/ndk-build" \
            -C "$hev_source" \
            APP_ABI=arm64-v8a \
            APP_MODULES=hev-socks5-tunnel \
            -j"$(nproc)"
          library="$hev_source/libs/arm64-v8a/libhev-socks5-tunnel.so"
          [[ -s "$library" ]] || {
            echo "HevSocks5Tunnel JNI library was not generated" >&2
            exit 1
          }
          readelf -Ws "$library" | grep -q 'JNI_OnLoad' || {
            echo "HevSocks5Tunnel library does not export JNI_OnLoad" >&2
            exit 1
          }
          mkdir -p android/android/app/src/main/jniLibs/arm64-v8a
          cp "$library" android/android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so

      - name: Download and verify Android runtime files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          import pathlib
          import re
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "Mclash-GitHub-Build",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          api_headers = dict(headers)
          api_headers["Authorization"] = f"Bearer {os.environ['GH_TOKEN']}"

          def request(url, *, api=False):
              selected_headers = api_headers if api else headers
              return urllib.request.urlopen(
                  urllib.request.Request(url, headers=selected_headers)
              )

          def asset(repo, pattern):
              with request(
                  f"https://api.github.com/repos/{repo}/releases/latest", api=True
              ) as response:
                  release = json.load(response)
              matches = [item for item in release.get("assets", []) if re.fullmatch(pattern, item["name"])]
              if len(matches) != 1:
                  raise SystemExit(f"expected one {repo} asset matching {pattern}, found {len(matches)}")
              item = matches[0]
              digest = item.get("digest", "")
              if not digest.startswith("sha256:"):
                  raise SystemExit(f"{item['name']} has no SHA-256 digest")
              with request(item["browser_download_url"]) as response:
                  data = response.read()
              actual = hashlib.sha256(data).hexdigest()
              if actual.lower() != digest.removeprefix("sha256:").lower():
                  raise SystemExit(f"SHA-256 mismatch for {item['name']}")
              return data

          native = pathlib.Path("android/android/app/src/main/jniLibs/arm64-v8a")
          geodata = pathlib.Path("android/android/app/src/main/assets/geodata")
          native.mkdir(parents=True, exist_ok=True)
          geodata.mkdir(parents=True, exist_ok=True)

          mihomo = asset("MetaCubeX/mihomo", r"mihomo-android-arm64-v8-v[^/]+\.gz")
          (native / "libmihomo.so").write_bytes(gzip.decompress(mihomo))
          for name in ("geosite.dat", "geoip.dat", "country.mmdb"):
              (geodata / name).write_bytes(asset("MetaCubeX/meta-rules-dat", re.escape(name)))
          PY
          chmod 0755 \
            android/android/app/src/main/jniLibs/arm64-v8a/libmihomo.so \
            android/android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so

      - name: Build Android APK
        shell: bash
        working-directory: android
        env:
          BUILD_MODE: release
        run: ./build-mclash-android.sh

      - name: Name Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_file="android/dist/Mclash-android-arm64-v8a-release.apk"
          output_file="android/dist/Mclash-android-${APP_VERSION}+${BUILD_NUMBER}-arm64-v8a.apk"
          mv "$source_file" "$output_file"
          (cd android/dist && sha256sum "$(basename "$output_file")" > "$(basename "$output_file").sha256")

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mclash-android-${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}
          path: |
            android/dist/Mclash-android-${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}-arm64-v8a.apk
            android/dist/Mclash-android-${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}-arm64-v8a.apk.sha256
          if-no-files-found: error

  windows:
    name: Windows
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      APP_VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows/windows-service/go.mod
          cache-dependency-path: windows/windows-service/go.sum

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Set selected version
        shell: powershell
        run: |
          $path = "windows/mclash/pubspec.yaml"
          $content = Get-Content -LiteralPath $path -Raw
          $updated = $content -replace '(?m)^version:\s*.*$', "version: $env:APP_VERSION+$env:BUILD_NUMBER"
          if ($updated -eq $content) {
            throw "$path does not contain a replaceable version field"
          }
          Set-Content -LiteralPath $path -Value $updated -Encoding utf8

      - name: Build Windows installer
        shell: powershell
        env:
          MCLASH_VERSION: ${{ needs.validate.outputs.version }}
          MCLASH_BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
          GH_TOKEN: ${{ github.token }}
        run: ./windows/scripts/build-windows.ps1

      - name: Create Windows checksum
        shell: powershell
        run: |
          $name = "Mclash-Windows-Setup-$env:APP_VERSION+$env:BUILD_NUMBER-x64.exe"
          $installer = Join-Path "windows/installer/Output" $name
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Windows installer was not generated: $installer"
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mclash-windows-${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}
          path: |
            windows/installer/Output/Mclash-Windows-Setup-${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}-x64.exe
            windows/installer/Output/Mclash-Windows-Setup-${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}-x64.exe.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: >-
      ${{ always() && inputs.target == 'all' &&
          needs.validate.result == 'success' &&
          needs.root.result == 'success' &&
          needs.android.result == 'success' &&
          needs.windows.result == 'success' }}
    needs:
      - validate
      - root
      - android
      - windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      APP_VERSION: ${{ needs.validate.outputs.version }}
      BUILD_NUMBER: ${{ needs.validate.outputs.build_number }}
      RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
      MIHOMO_VERSION: ${{ needs.validate.outputs.mihomo_version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Mclash-*-${{ needs.validate.outputs.version }}+${{ needs.validate.outputs.build_number }}
          path: release-assets
          merge-multiple: true

      - name: Validate release assets
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            "Mclash-root-${APP_VERSION}+${BUILD_NUMBER}-arm64-v8a.apk"
            "Mclash-root-${APP_VERSION}+${BUILD_NUMBER}-arm64-v8a.apk.sha256"
            "Mclash-android-${APP_VERSION}+${BUILD_NUMBER}-arm64-v8a.apk"
            "Mclash-android-${APP_VERSION}+${BUILD_NUMBER}-arm64-v8a.apk.sha256"
            "Mclash-Windows-Setup-${APP_VERSION}+${BUILD_NUMBER}-x64.exe"
            "Mclash-Windows-Setup-${APP_VERSION}+${BUILD_NUMBER}-x64.exe.sha256"
          )
          for name in "${expected[@]}"; do
            [[ -s "release-assets/$name" ]] || {
              echo "Missing or empty release asset: $name" >&2
              exit 1
            }
          done

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          python3 <<'PY'
          import os
          import pathlib

          lines = [f"Mihomo 内核：`{os.environ['MIHOMO_VERSION']}`"]
          custom_notes = os.environ["RELEASE_NOTES"].strip()
          if custom_notes:
              lines.extend(("", custom_notes))
          pathlib.Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mclash ${APP_VERSION} Build ${BUILD_NUMBER}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

      - name: Store latest build defaults
        shell: bash
        env:
          VERSION_SYNC_DEPLOY_KEY: ${{ secrets.VERSION_SYNC_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          [[ -n "$VERSION_SYNC_DEPLOY_KEY" ]] || {
            echo "Missing repository secret: VERSION_SYNC_DEPLOY_KEY" >&2
            exit 1
          }
          git pull --ff-only origin main
          python3 <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path(".github/workflows/build-all.yml")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          values = {
              "version": os.environ["APP_VERSION"],
              "build_number": os.environ["BUILD_NUMBER"],
          }
          current_input = None
          updated = set()
          inside_inputs = False

          for index, line in enumerate(lines):
              if line.rstrip("\r\n") == "    inputs:":
                  inside_inputs = True
                  continue
              if inside_inputs and line and not line[0].isspace():
                  break
              match = re.fullmatch(r"      (version|build_number):\s*", line.rstrip("\r\n"))
              if match:
                  current_input = match.group(1)
                  continue
              if current_input and re.match(r"^        default:\s*", line):
                  newline = "\r\n" if line.endswith("\r\n") else "\n"
                  lines[index] = f'        default: "{values[current_input]}"{newline}'
                  updated.add(current_input)
                  current_input = None

          if updated != set(values):
              raise SystemExit(f"Failed to update workflow defaults: {sorted(updated)}")
          path.write_text("".join(lines), encoding="utf-8", newline="")

          release_version = f"{values['version']}+{values['build_number']}"
          for pubspec_path in (
              pathlib.Path("root/pubspec.yaml"),
              pathlib.Path("android/pubspec.yaml"),
              pathlib.Path("windows/mclash/pubspec.yaml"),
          ):
              text = pubspec_path.read_text(encoding="utf-8")
              replaced, count = re.subn(
                  r"(?m)^version:\s*.*$", f"version: {release_version}", text
              )
              if count != 1:
                  raise SystemExit(
                      f"{pubspec_path} must contain exactly one version field"
                  )
              pubspec_path.write_text(replaced, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/build-all.yml \
            root/pubspec.yaml \
            android/pubspec.yaml \
            windows/mclash/pubspec.yaml
          if git diff --cached --quiet; then
            echo "Workflow defaults and source versions already match ${APP_VERSION}+${BUILD_NUMBER}."
            exit 0
          fi
          git commit -m "[skip ci] Sync release version to ${APP_VERSION}+${BUILD_NUMBER}"
          key_file="$RUNNER_TEMP/mclash-version-sync"
          known_hosts="$RUNNER_TEMP/mclash-version-sync-known-hosts"
          cleanup_version_sync() {
            rm -f "$key_file" "$known_hosts"
          }
          trap cleanup_version_sync EXIT
          printf '%s\n' "$VERSION_SYNC_DEPLOY_KEY" > "$key_file"
          chmod 600 "$key_file"
          python3 <<'PY' > "$known_hosts"
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://api.github.com/meta",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              metadata = json.load(response)
          for key in metadata.get("ssh_keys", []):
              print(f"github.com {key}")
          PY
          [[ -s "$known_hosts" ]] || {
            echo "Failed to obtain GitHub SSH host keys" >&2
            exit 1
          }
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
