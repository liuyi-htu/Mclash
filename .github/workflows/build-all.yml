name: Build Mclash clients

on:
  workflow_dispatch:
    inputs:
      target:
        description: Client to build
        required: true
        default: all
        type: choice
        options:
          - all
          - root
          - android
          - windows
      version:
        description: Version in x.y.z format
        required: true
        default: 2.1.0
        type: string
      build_number:
        description: Positive integer Android/Windows build number
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: build-mclash-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.32.8
  APP_VERSION: ${{ inputs.version }}
  BUILD_NUMBER: ${{ inputs.build_number }}

jobs:
  validate:
    name: Validate build parameters
    runs-on: ubuntu-latest
    steps:
      - name: Validate version and build number
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must use x.y.z format" >&2
            exit 1
          }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "build_number must be a positive integer" >&2
            exit 1
          }

  root:
    name: Root Android
    if: ${{ inputs.target == 'all' || inputs.target == 'root' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set selected version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("root/pubspec.yaml")
          text = path.read_text(encoding="utf-8")
          version = f"{os.environ['APP_VERSION']}+{os.environ['BUILD_NUMBER']}"
          updated, count = re.subn(r"(?m)^version:\s*.*$", f"version: {version}", text)
          if count != 1:
              raise SystemExit("root/pubspec.yaml must contain exactly one version field")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Configure Android release signing
        shell: bash
        env:
          SIGNING_JKS_BASE64: ${{ secrets.SIGNING_JKS_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_JKS_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || {
              echo "Missing repository secret: $name" >&2
              exit 1
            }
          done
          printf '%s' "$SIGNING_JKS_BASE64" | base64 --decode > root/android/mclash-release.jks
          {
            echo 'storeFile=mclash-release.jks'
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > root/android/key.properties

      - name: Build Root APK
        shell: bash
        working-directory: root
        run: ./build-mclash-root.sh

      - name: Name Root artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_file="root/dist/Mclash-root-arm64-v8a.apk"
          output_file="root/dist/Mclash-root-${APP_VERSION}+${BUILD_NUMBER}-arm64-v8a.apk"
          mv "$source_file" "$output_file"
          (cd root/dist && sha256sum "$(basename "$output_file")" > "$(basename "$output_file").sha256")

      - name: Upload Root artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mclash-root-${{ inputs.version }}+${{ inputs.build_number }}
          path: |
            root/dist/Mclash-root-${{ inputs.version }}+${{ inputs.build_number }}-arm64-v8a.apk
            root/dist/Mclash-root-${{ inputs.version }}+${{ inputs.build_number }}-arm64-v8a.apk.sha256
          if-no-files-found: error

  android:
    name: Android
    if: ${{ inputs.target == 'all' || inputs.target == 'android' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set selected version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("android/pubspec.yaml")
          text = path.read_text(encoding="utf-8")
          version = f"{os.environ['APP_VERSION']}+{os.environ['BUILD_NUMBER']}"
          updated, count = re.subn(r"(?m)^version:\s*.*$", f"version: {version}", text)
          if count != 1:
              raise SystemExit("android/pubspec.yaml must contain exactly one version field")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Configure Android release signing
        shell: bash
        env:
          SIGNING_JKS_BASE64: ${{ secrets.SIGNING_JKS_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SIGNING_JKS_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || {
              echo "Missing repository secret: $name" >&2
              exit 1
            }
          done
          printf '%s' "$SIGNING_JKS_BASE64" | base64 --decode > android/android/mclash-release.jks
          {
            echo 'storeFile=mclash-release.jks'
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/android/key.properties

      - name: Build HevSocks5Tunnel JNI library
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "ndk;27.2.12479018" >/dev/null
          hev_tag=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'User-Agent: Mclash-GitHub-Build' \
            https://api.github.com/repos/heiher/hev-socks5-tunnel/releases/latest |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          [[ "$hev_tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Unexpected HevSocks5Tunnel release tag: $hev_tag" >&2
            exit 1
          }
          hev_source="$RUNNER_TEMP/hev-socks5-tunnel"
          git clone --depth 1 --branch "$hev_tag" --recurse-submodules \
            https://github.com/heiher/hev-socks5-tunnel.git "$hev_source"
          ln -s . "$hev_source/jni"
          "$ANDROID_SDK_ROOT/ndk/27.2.12479018/ndk-build" \
            -C "$hev_source" \
            APP_ABI=arm64-v8a \
            APP_MODULES=hev-socks5-tunnel \
            -j"$(nproc)"
          library="$hev_source/libs/arm64-v8a/libhev-socks5-tunnel.so"
          [[ -s "$library" ]] || {
            echo "HevSocks5Tunnel JNI library was not generated" >&2
            exit 1
          }
          readelf -Ws "$library" | grep -q 'JNI_OnLoad' || {
            echo "HevSocks5Tunnel library does not export JNI_OnLoad" >&2
            exit 1
          }
          mkdir -p android/android/app/src/main/jniLibs/arm64-v8a
          cp "$library" android/android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so

      - name: Download and verify Android runtime files
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip
          import hashlib
          import json
          import pathlib
          import re
          import urllib.request

          headers = {
              "Accept": "application/vnd.github+json",
              "User-Agent": "Mclash-GitHub-Build",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=headers))

          def asset(repo, pattern):
              with request(f"https://api.github.com/repos/{repo}/releases/latest") as response:
                  release = json.load(response)
              matches = [item for item in release.get("assets", []) if re.fullmatch(pattern, item["name"])]
              if len(matches) != 1:
                  raise SystemExit(f"expected one {repo} asset matching {pattern}, found {len(matches)}")
              item = matches[0]
              digest = item.get("digest", "")
              if not digest.startswith("sha256:"):
                  raise SystemExit(f"{item['name']} has no SHA-256 digest")
              with request(item["browser_download_url"]) as response:
                  data = response.read()
              actual = hashlib.sha256(data).hexdigest()
              if actual.lower() != digest.removeprefix("sha256:").lower():
                  raise SystemExit(f"SHA-256 mismatch for {item['name']}")
              return data

          native = pathlib.Path("android/android/app/src/main/jniLibs/arm64-v8a")
          geodata = pathlib.Path("android/android/app/src/main/assets/geodata")
          native.mkdir(parents=True, exist_ok=True)
          geodata.mkdir(parents=True, exist_ok=True)

          mihomo = asset("MetaCubeX/mihomo", r"mihomo-android-arm64-v8-v[^/]+\.gz")
          (native / "libmihomo.so").write_bytes(gzip.decompress(mihomo))
          for name in ("geosite.dat", "geoip.dat", "country.mmdb"):
              (geodata / name).write_bytes(asset("MetaCubeX/meta-rules-dat", re.escape(name)))
          PY
          chmod 0755 \
            android/android/app/src/main/jniLibs/arm64-v8a/libmihomo.so \
            android/android/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so

      - name: Build Android APK
        shell: bash
        working-directory: android
        env:
          BUILD_MODE: release
        run: ./build-mclash-android.sh

      - name: Name Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_file="android/dist/Mclash-android-arm64-v8a-release.apk"
          output_file="android/dist/Mclash-android-${APP_VERSION}+${BUILD_NUMBER}-arm64-v8a.apk"
          mv "$source_file" "$output_file"
          (cd android/dist && sha256sum "$(basename "$output_file")" > "$(basename "$output_file").sha256")

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mclash-android-${{ inputs.version }}+${{ inputs.build_number }}
          path: |
            android/dist/Mclash-android-${{ inputs.version }}+${{ inputs.build_number }}-arm64-v8a.apk
            android/dist/Mclash-android-${{ inputs.version }}+${{ inputs.build_number }}-arm64-v8a.apk.sha256
          if-no-files-found: error

  windows:
    name: Windows
    if: ${{ inputs.target == 'all' || inputs.target == 'windows' }}
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: windows/windows-service/go.mod
          cache-dependency-path: windows/windows-service/go.sum

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Set selected version
        shell: powershell
        run: |
          $path = "windows/mclash/pubspec.yaml"
          $content = Get-Content -LiteralPath $path -Raw
          $updated = $content -replace '(?m)^version:\s*.*$', "version: $env:APP_VERSION+$env:BUILD_NUMBER"
          if ($updated -eq $content) {
            throw "$path does not contain a replaceable version field"
          }
          Set-Content -LiteralPath $path -Value $updated -Encoding utf8

      - name: Build Windows installer
        shell: powershell
        env:
          MCLASH_VERSION: ${{ inputs.version }}
        run: ./windows/scripts/build-windows.ps1

      - name: Create Windows checksum
        shell: powershell
        run: |
          $name = "Mclash-Windows-Setup-$env:APP_VERSION.exe"
          $installer = Join-Path "windows/installer/Output" $name
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Windows installer was not generated: $installer"
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath "$installer.sha256" -Encoding ascii

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mclash-windows-${{ inputs.version }}+${{ inputs.build_number }}
          path: |
            windows/installer/Output/Mclash-Windows-Setup-${{ inputs.version }}.exe
            windows/installer/Output/Mclash-Windows-Setup-${{ inputs.version }}.exe.sha256
          if-no-files-found: error
