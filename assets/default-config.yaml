mixed-port: 7890
redir-port: 7891
tproxy-port: 1536
ipv6: false
mode: rule
allow-lan: true
bind-address: "*"

disable-keep-alive: false
keep-alive-idle: 15
keep-alive-interval: 15
unified-delay: true
tcp-concurrent: true
log-level: error
find-process-mode: "off"

profile:
  store-selected: true
  store-fake-ip: true

geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"

external-controller: 0.0.0.0:9090
external-ui: WebUI/ZashBoard
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip"
external-controller-cors:
  allow-origins:
    - "*"
  allow-private-network: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 5228, 8443]
    QUIC:
      ports: [443, 8443]

tun:
  enable: false
  device: Meta
  stack: mixed
  dns-hijack:
    - any:53
    - tcp://any:53
  udp-timeout: 300
  auto-route: true
  strict-route: true
  auto-redirect: false
  auto-detect-interface: true

dns:
  enable: true
  ipv6: false

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  cache-algorithm: arc

  respect-rules: true

  use-hosts: true
  use-system-hosts: false

  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.localdomain"
    - "+.home.arpa"
    - "localhost"
    - "*.localhost"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"

  # Bootstrap DNS
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  # 解析机场服务器域名
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 国外域名 DNS → 国外代理
  nameserver:
    - "https://1.1.1.1/dns-query#🌍 国外"
    - "https://8.8.8.8/dns-query#🌍 国外"
  # 国内域名 DNS → 国内代理
  nameserver-policy:
    "geosite:cn":
      - "https://dns.alidns.com/dns-query#🚀 国内"
      - "https://doh.pub/dns-query#🚀 国内"

proxy-providers:
  机场:
    type: http
    url: "https://edt.246.ccwu.cc/sub?token=de0bfcac8b1a218363f0e8ea1103be19"
    path: ./profiles/机场.yaml
    interval: 43200
    health-check:
      enable: true
      interval: 3600
      url: "https://www.gstatic.com/generate_204"
      timeout: 3000

proxy-groups:
- name: 🚀 国内
  type: select
  url: http://connect.rom.miui.com/generate_204
  proxies:
      - DIRECT
  use:
      - 机场
  filter: "上海"
- name: 🌍 国外
  type: select
  url: http://www.gstatic.com/generate_204
  use:
      - 机场
  filter: "KR"

rules:
#  - DST-PORT,22,DIRECT
  - AND,((NETWORK,UDP),(DST-PORT,443)),REJECT
  - GEOSITE,openai,🌍 国外
  - GEOSITE,youtube,🌍 国外
  - GEOSITE,telegram,🌍 国外
  - GEOIP,telegram,🌍 国外,no-resolve
  - GEOSITE,google,🌍 国外
  - GEOSITE,CN,🚀 国内
  - GEOIP,CN,🚀 国内,no-resolve
  - MATCH,🌍 国外
